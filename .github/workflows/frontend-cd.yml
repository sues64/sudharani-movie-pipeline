name: Frontend CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yml'

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd starter/frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd starter/frontend
          npm run lint --if-present

      - name: Test Frontend
        run: |
          cd starter/frontend
          npm test -- --watchAll=false --passWithNoTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker Build and Push
        run: |
          cd starter/frontend
          docker build -t ${{ secrets.AWS_ECR_REPOSITORY_FRONTEND }}:latest .
          docker push ${{ secrets.AWS_ECR_REPOSITORY_FRONTEND }}:latest

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f starter/frontend/k8s/